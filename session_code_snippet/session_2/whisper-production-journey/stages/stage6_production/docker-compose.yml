# Stage 6: Production Docker Compose
# Complete orchestration with monitoring

services:
  # ===========================================
  # WHISPER API (Main Service)
  # ===========================================
  whisper-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - WHISPER_MODEL=base
      - COMPUTE_TYPE=int8
      - MAX_WORKERS=4
      - MAX_QUEUE_SIZE=50
      - REQUEST_TIMEOUT=120
      - LOG_LEVEL=INFO
    volumes:
      - ../../audio_samples:/app/audio_samples:ro
      - whisper_models:/tmp/whisper_models
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # ===========================================
  # NGINX (Reverse Proxy)
  # ===========================================
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - whisper-api
    restart: unless-stopped

  # ===========================================
  # LOCUST (Load Testing)
  # ===========================================
  locust:
    image: locustio/locust:2.20.0
    ports:
      - "8089:8089"
    volumes:
      - ../stage2_load_test_fail/locustfile.py:/mnt/locust/locustfile.py:ro
      - ../../audio_samples:/mnt/locust/audio_samples:ro
    command: -f /mnt/locust/locustfile.py --host=http://whisper-api:8000
    depends_on:
      - whisper-api
    profiles:
      - testing

  # ===========================================
  # PROMETHEUS (Metrics Collection)
  # ===========================================
  prometheus:
    image: prom/prometheus:v2.47.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    depends_on:
      - whisper-api
    profiles:
      - monitoring

  # ===========================================
  # GRAFANA (Visualization)
  # ===========================================
  grafana:
    image: grafana/grafana:10.1.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    profiles:
      - monitoring

volumes:
  whisper_models:
  prometheus_data:
  grafana_data:

# Usage:
# ------
# Basic: docker compose up -d whisper-api
# With monitoring: docker compose --profile monitoring up -d
# With load testing: docker compose --profile testing up -d
# Everything: docker compose --profile monitoring --profile testing up -d
