# Prometheus configuration for Whisper API monitoring

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Whisper API metrics
  - job_name: 'whisper-api'
    static_configs:
      - targets: ['whisper-api:8000']
    metrics_path: /metrics
    scrape_interval: 10s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
