# Nginx Demo Config
# =================
# Optimized for docker compose --scale demonstration
#
# Key features:
# - Docker Compose service discovery
# - Least connections load balancing
# - Request ID propagation for tracing
# - Streaming support disabled (simpler for demo)

events {
    worker_connections 1024;
}

http {
    # JSON logging for demo visibility
    log_format demo escape=json '{'
        '"time":"$time_iso8601",'
        '"upstream":"$upstream_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"request_time":$request_time,'
        '"request_id":"$http_x_request_id"'
    '}';

    access_log /dev/stdout demo;
    error_log /dev/stderr warn;

    # Upload size for audio files
    client_max_body_size 100M;

    # Timeouts
    proxy_connect_timeout 30s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;

    # Upstream - Docker Compose automatically DNS resolves service names
    upstream whisper_backend {
        least_conn;
        server whisper-api:8000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        # Health check - lightweight, hits any worker
        location = /health {
            proxy_pass http://whisper_backend/health/live;
            proxy_connect_timeout 5s;
            proxy_read_timeout 5s;
        }

        # Detailed health (for debugging)
        location = /health/full {
            proxy_pass http://whisper_backend/health;
        }

        # Metrics aggregation would need custom solution
        # For demo, just proxy to one worker
        location = /metrics {
            proxy_pass http://whisper_backend/metrics;
        }

        # Main transcription endpoint
        location /transcribe {
            proxy_pass http://whisper_backend;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Pass through request ID for tracing
            proxy_set_header X-Request-ID $http_x_request_id;
            
            # Don't buffer uploads
            proxy_request_buffering off;
            
            # Retry on upstream failure
            proxy_next_upstream error timeout http_503;
            proxy_next_upstream_tries 2;
        }

        # API docs
        location /docs {
            proxy_pass http://whisper_backend/docs;
        }

        location /openapi.json {
            proxy_pass http://whisper_backend/openapi.json;
        }

        # Root redirect to docs
        location = / {
            return 302 /docs;
        }
    }
}
