# Nginx configuration for Whisper API
# Handles: SSL termination, load balancing, rate limiting, streaming

events {
    worker_connections 1024;
}

http {
    # Logging
    log_format json_combined escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"request_id":"$request_id"'
    '}';

    access_log /var/log/nginx/access.log json_combined;

    # Rate limiting zone
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Upload size limit
    client_max_body_size 100M;

    # Timeouts for long-running transcription
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    upstream whisper_backend {
        server whisper-api:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Request ID for tracing
        set $request_id $request_id;
        if ($http_x_request_id) {
            set $request_id $http_x_request_id;
        }

        # Health check endpoint (no rate limiting)
        location /health {
            proxy_pass http://whisper_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
        }

        # Metrics endpoint (internal only in production)
        location /metrics {
            proxy_pass http://whisper_backend;
            # In production, add IP allowlist:
            # allow 10.0.0.0/8;
            # deny all;
        }

        # Streaming endpoint - DISABLE BUFFERING
        location /transcribe/stream {
            proxy_pass http://whisper_backend;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-ID $request_id;
            
            # Critical for SSE streaming
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            
            # Longer timeout for streaming
            proxy_read_timeout 600s;
        }

        # Standard transcription endpoint
        location /transcribe {
            # Rate limiting
            limit_req zone=api_limit burst=20 nodelay;
            
            proxy_pass http://whisper_backend;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
            
            # Large file upload support
            proxy_request_buffering off;
        }

        # API docs
        location /docs {
            proxy_pass http://whisper_backend;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://whisper_backend;
            proxy_set_header Host $host;
        }

        # Root
        location / {
            proxy_pass http://whisper_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
        }
    }
}
