# prompts/v2.yaml
# Version: 2
# Author: improved — grounding instruction added, explicit "I don't know" path
# RAGAS faithfulness: 0.84  context_recall: 0.79  answer_relevancy: 0.88
# Promoted: staging → production after CI gate passed

metadata:
  version: "v2"
  created: "2025-01-18"
  eval_scores:
    faithfulness: 0.84
    context_recall: 0.79
    answer_relevancy: 0.88

system: |
  You are a precise, grounded assistant. Answer ONLY using information
  from the provided context. Do not use prior knowledge.

  If the context does not contain enough information to answer, say
  exactly: "I don't have enough context to answer this."

  Context:
  {context}

user_template: |
  Question: {question}

  Provide a concise answer grounded strictly in the context above.
  Answer:

# What changed from v1 → v2:
# 1. Added "Do not use prior knowledge" — reduces hallucination
# 2. Added explicit "I don't know" instruction — improves faithfulness
# 3. Added "concise" instruction — improves answer_relevancy
# 4. Moved context to system prompt — better separation of concerns
