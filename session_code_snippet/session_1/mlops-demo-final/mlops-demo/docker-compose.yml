# docker-compose.yml
# Self-hosted Langfuse v2 — production observability, entirely in your infra.

services:

  langfuse:
    image: langfuse/langfuse:2
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL:           postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL:           http://localhost:3000
      NEXTAUTH_SECRET:        ${NEXTAUTH_SECRET:-changeme-use-a-real-secret-in-prod}
      SALT:                   ${SALT:-changeme-use-a-real-salt-in-prod}
      TELEMETRY_ENABLED:      "false"
    restart: unless-stopped

  langfuse-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER:     langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB:       langfuse
    volumes:
      - langfuse_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  langfuse_pg_data:
